name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - run: bun install
      - run: bun run build
      - run: bun run lint
      # No private repo, path, host or commit in the public SDK paths (scripts/check-public.ts). The list of names is
      # internal/public-deny.txt here, the PUBLIC_CHECK_DENY secret in the public repo (fork PRs: generic rule only).
      - run: bun run check:public
        env:
          PUBLIC_CHECK_DENY: ${{ secrets.PUBLIC_CHECK_DENY }}
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - run: bun install
      - run: bun run build
      - run: bun run test

  # What npm will get, checked before it is published: publint (package.json, exports, files) and
  # are-the-types-wrong (types resolve for every entry; lefine only, the other two ship a bin and no
  # types). Versions are pinned in each package's check:package script. Add a package here once it
  # ships to npm. The matrix value is the folder under packages/.
  package-check:
    name: Package check (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [lefine, lefine-cli, lefine-mcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - run: bun install
      # lefine-mcp has no build (its bin is plain JS).
      - run: if jq -e '.scripts.build' package.json > /dev/null; then bun run build; fi
        working-directory: packages/${{ matrix.package }}
      - run: bun run check:package
        working-directory: packages/${{ matrix.package }}

  # The examples we link from answers (examples/): each one installed with this PR's lefine (built and packed by the
  # smoke script), then typechecked and built. No Lefine here: the full path (push, publish, CDN, run) is the same
  # script against a running stack (examples/README.md). LEFINE_NO_BROWSER: no step may open a browser.
  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [nextjs, vite-react, expo]
    env:
      LEFINE_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: bun install
      - run: bun scripts/smoke/dev-path.ts --example ${{ matrix.example }} --offline

  # lefine claims Next 16 (proxy.ts, revalidateTag profiles); the workspace pins Next 15 for the legacy
  # @better-i18n/next. This runs lefine's tests and types in a temp folder with Next 16 (audit #10).
  lefine-next16:
    name: lefine on Next 16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - run: packages/lefine/scripts/next16-check.sh

  flutter:
    name: Flutter Test & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
