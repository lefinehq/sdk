name: Release

# Two jobs in one file: npm's trusted publisher names this file (publish.yml), so both stay here.
#
# - push to main  -> `version`: opens or updates the "Version Packages" PR. It never publishes:
#   changesets/action gets no `publish` command and the job has no id-token.
# - workflow_dispatch on main (Actions -> Release -> Run workflow) -> `publish`: scripts/release.ts
#   publishes every version npm does not have yet. Running it is the release decision.
#
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN. Each package lists this repository and
# publish.yml as its trusted publisher on npmjs.com; docs/releasing.md has the exact settings. npm adds
# provenance by itself when the repo is public. Trusted publishing needs npm >= 11.5.1 and
# Node >= 22.14 (docs.npmjs.com/trusted-publishers).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and run npm publish --dry-run only (nothing goes to npm)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Version Packages PR
    runs-on: ubuntu-latest
    if: github.repository == 'lefinehq/sdk' && github.event_name == 'push'
    permissions:
      contents: write # the version PR branch
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Install Dependencies
        run: bun install

      # No `publish:` input: with pending changesets this opens or updates the PR, without any it does nothing.
      - name: Create or update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: github.repository == 'lefinehq/sdk' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # release tags
      id-token: write # npm trusted publishing
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Node 24 may bundle an npm older than 11.5.1, which cannot use OIDC and fails as ENEEDAUTH.
      - name: Pin npm
        run: npm install -g npm@11.21.1 && npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Install Dependencies
        run: bun install

      - name: Build All Packages
        run: bun run build

      # What ships must not point into Lefine's private side (scripts/check-public.ts).
      - name: Public check
        run: bun run check:public --require-list
        env:
          PUBLIC_CHECK_DENY: ${{ secrets.PUBLIC_CHECK_DENY }}

      # Dependencies first, dist/ checked, one tarball per package, npm view + integrity check, then a tag.
      # The tarballs, SHA256SUMS and release.json go to release-artifacts/ (uploaded below).
      - name: Publish
        run: bun scripts/release.ts --out release-artifacts ${{ inputs.dry-run && '--dry-run' || '' }}

      # release.ts tags only what npm has, so a partial failure still pushes the tags that are real.
      - name: Push release tags
        if: ${{ !cancelled() && !inputs.dry-run }}
        run: git push origin --tags

      - name: Upload the published tarballs and their digests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}
          path: release-artifacts/
          if-no-files-found: ignore
          retention-days: 90
